name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY_B64: ${{ secrets.EC2_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "$EC2_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/recallmeet.pem
          chmod 600 ~/.ssh/recallmeet.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/recallmeet.pem \
            "$EC2_USER@$EC2_HOST" \
            "cd ~/MeetMind && \
             git fetch origin main && \
             git checkout main && \
             git reset --hard $DEPLOY_SHA && \
             cd backend && \
             docker build -t recallmeet-backend:latest . && \
             docker compose up -d --no-build --force-recreate && \
             docker image prune -f"

          rm -f ~/.ssh/recallmeet.pem
