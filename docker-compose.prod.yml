services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recallmeet
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    image: recallmeet-backend:latest
    env_file: ./backend/.env
    depends_on: [db, redis]
    restart: unless-stopped

  worker:
    image: recallmeet-backend:latest
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    env_file: ./backend/.env
    depends_on: [db, redis, backend]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config: