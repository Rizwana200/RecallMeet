# backend/docker-compose.test.yml
# Isolated test infrastructure — separate ports from anything else running
# locally, and a throwaway DB. Never points at real Supabase/Upstash.
services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recallmeet_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"